# Full local stack: `docker compose up --build`
#   frontend → http://localhost:3000
#   api      → http://localhost:4000  (health: /health)
#
# For day-to-day development you can run only the dependencies:
#   docker compose up -d postgres redis
# and start backend/frontend with `npm run dev`.

name: auctionride

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auctionride
      POSTGRES_PASSWORD: auctionride
      POSTGRES_DB: auctionride
    ports:
      # 5433 on the host to avoid clashing with a locally installed Postgres.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auctionride -d auctionride']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires noeviction: an evicted job key would silently drop an auction transition.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      DATABASE_URL: postgresql://auctionride:auctionride@postgres:5432/auctionride?schema=public
      DIRECT_URL: postgresql://auctionride:auctionride@postgres:5432/auctionride?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-secret-please-change-0123456789abcdef}
      # Plain HTTP on localhost: cookies cannot be Secure here. Always true behind HTTPS.
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      # Single-instance compose stack: run migrations + seed at start and the workers in-process.
      RUN_MIGRATIONS: 'true'
      RUN_SEED: 'true'
      RUN_WORKERS: 'true'
      SEED_ADMIN_EMAIL: admin@auctionride.dev
      SEED_ADMIN_PASSWORD: Admin@12345
      UPLOAD_DIR: /app/uploads
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — must be reachable from the browser.
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  redis-data:
  uploads:
